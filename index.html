<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamilės Roast Centras v10.0 — SUTAISYTA FOTO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', sans-serif;
      background: #050910;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }

    .main-container {
      width: min(1500px, calc(100vw - 32px));
      margin: 32px auto;
      background: rgba(4, 18, 26, 0.94);
      border: 6px solid #ff3a8a;
      border-radius: 42px;
      box-shadow: 0 0 30px rgba(255, 58, 138, 0.9), 0 0 80px rgba(255, 58, 138, 0.28);
      padding: 22px 28px 16px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }

    .fight-date {
      text-align: center;
      font-size: clamp(1.1rem, 1.8vw, 2rem);
      letter-spacing: 0.1em;
      font-weight: 900;
      color: #ff4db8;
      text-shadow: 0 0 16px rgba(255, 77, 184, 0.9);
      margin: 0 0 18px;
      font-family: 'Comic Neue', cursive;
    }

    .header-zone {
      width: 100%;
    }

    .versus-zone {
      width: 100%;
    }

    .battle-banner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-sizing: border-box;
    }

    .fighter-box {
      width: calc(50% - 58px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .fighter-pill {
      width: 100%;
      height: clamp(180px, 23vw, 280px);
      border-radius: 42% / 52%;
      overflow: hidden;
      position: relative;
      border: 4px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.12);
    }

    .fighter-pill.pink {
      background: #f66bb5;
      box-shadow: 0 0 28px rgba(255, 58, 138, 0.9);
    }

    .fighter-pill.cyan {
      background: #56e4ff;
      box-shadow: 0 0 28px rgba(35, 233, 255, 0.9);
    }

    .fighter-pill img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
      filter: none;
    }

    .vs-text {
      font-family: 'Comic Neue', cursive;
      font-size: clamp(3.6rem, 8vw, 9rem);
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(255, 58, 138, 0.9), 0 0 28px rgba(136, 90, 255, 0.8);
      font-weight: 900;
      margin: 0 18px;
      transform: translateY(-8px);
    }

    .fighter-title {
      margin-top: 18px;
      font-family: 'Comic Neue', cursive;
      font-size: clamp(1.2rem, 2vw, 2rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-shadow: 0 0 12px currentColor;
    }

    h1 {
      font-family: 'Comic Neue', cursive;
      font-size: 3.5rem;
      color: #00ffff;
      text-shadow: 4px 4px #ff007f;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    .counter-box {
      background: #ff007f;
      color: white;
      font-weight: bold;
      padding: 12px;
      border-radius: 12px;
      margin-top: 20px;
      margin-bottom: 20px;
      font-size: 1.3rem;
      border: 2px solid white;
      text-align: center;
    }

    .quote-banner {
      background: rgba(255, 0, 127, 0.12);
      border: 2px solid #ff007f;
      padding: 25px;
      border-radius: 20px;
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.4;
      text-align: center;
      margin-bottom: 35px;
      color: #fff;
    }

    .rage-banner {
      background: rgba(255, 0, 0, 0.25);
      border: 3px solid #ff0000;
      padding: 22px;
      border-radius: 15px;
      font-size: 1.7rem;
      font-weight: 800;
      text-align: center;
      margin-top: 25px;
      margin-bottom: 25px;
      color: #ff3366;
      text-transform: uppercase;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.6);
      animation: shakeRage 0.15s infinite alternate;
    }

    @keyframes shakeRage {
      0% { transform: translate(2px, 1px) rotate(0deg); }
      100% { transform: translate(-1px, -2px) rotate(1deg); }
    }

    .progress-wrapper {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid #00ffff;
      border-radius: 10px;
      padding: 5px;
      margin-bottom: 25px;
    }

    .progress-bar {
      height: 20px;
      background: linear-gradient(90deg, #00ffff, #ff007f);
      width: 0%;
      border-radius: 5px;
      transition: width 0.5s ease;
    }

    .wiki-section {
      text-align: left;
      line-height: 1.7;
      font-size: 1.05rem;
    }

    .wiki-block {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .wiki-block h2 {
      color: #00ffff;
      font-size: 1.5rem;
      margin-top: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .grid-item {
      background: rgba(0, 0, 0, 0.4);
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #ff007f;
      font-size: 0.95rem;
    }

    .grid-item strong {
      color: #ff007f;
      display: block;
      margin-bottom: 5px;
    }

    .live-alert {
      background: #7f00ff;
      border-left: 5px solid #00ffff;
      padding: 15px;
      font-size: 1rem;
      text-align: left;
      margin-top: 20px;
      margin-bottom: 20px;
      border-radius: 0 10px 10px 0;
    }

    .control-panel {
      text-align: center;
      margin-top: 40px;
      border-top: 2px dashed #00ffff;
      padding-top: 30px;
    }

    .btn-container {
      position: relative;
      height: 70px;
      max-width: 500px;
      margin-top: 20px;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 0;
    }

    .btn {
      padding-top: 15px;
      padding-bottom: 15px;
      padding-left: 40px;
      padding-right: 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    #peace-btn {
      background: #00ffff;
      color: black;
      position: absolute;
      left: 5%;
    }

    #sorry-btn {
      background: #ff007f;
      color: white;
      position: absolute;
      right: 5%;
      transition: all 0.12s ease;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 15, 30, 0.99);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #111827;
      border: 5px solid #00ffff;
      border-radius: 25px;
      padding: 35px;
      max-width: 750px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 0 60px #00ffff;
      transform: scale(0.8);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-title {
      font-family: 'Comic Neue', cursive;
      font-size: 2.8rem;
      color: #ff007f;
      text-shadow: 2px 2px #00ffff;
      margin-bottom: 20px;
      text-align: center;
    }

    .legal-text {
      background: rgba(0,0,0,0.5);
      padding: 20px;
      border-radius: 15px;
      font-size: 0.95rem;
      line-height: 1.6;
      text-align: left;
      border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 25px;
    }

    .close-modal-btn {
      background: #ff007f;
      color: white;
      border: none;
      padding-top: 12px;
      padding-bottom: 12px;
      padding-left: 40px;
      padding-right: 40px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
    }

    .floating-item {
      position: absolute;
      pointer-events: none;
      z-index: 1;
      animation: floatUp 4s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <audio id="troll-audio" src=""></audio>
  <audio id="win-audio" src=""></audio>

  <div class="main-container">
    <div class="fight-date">KOVA 2026-10-30</div>

    <div class="header-zone">
      <div class="versus-zone">
        <div class="battle-banner">
          <div class="fighter-box">
            <div class="fighter-pill pink">
              <img src="image_qfE1ZO.jpg" alt="Tavo nuotrauka">
            </div>
            <div class="fighter-title" style="color: #ff3a8a;">Savininkas esu 👑</div>
          </div>

          <div class="vs-text">VS</div>

          <div class="fighter-box">
            <div class="fighter-pill cyan">
              <img src="image_Lq2JRF.jpg" alt="Sesės nuotrauka">
            </div>
            <div class="fighter-title" style="color: #23e9ff;">ozysssssssssssssss 👑</div>
          </div>
        </div>
      </div>
    </div>
  </div>
